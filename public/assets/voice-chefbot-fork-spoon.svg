<svg width="170" height="205" viewBox="0 0 170 205" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Cute foody AI chef assistant holding a burger — listening animation</title>
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fab" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff8fab" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4f46e5" flood-opacity="0.28"/>
    </filter>
  </defs>

  <ellipse cx="85" cy="193" rx="34" ry="6" fill="#4f46e5" opacity="0.15">
    <animate attributeName="rx" values="34;28;34" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.08;0.15" dur="1.6s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="1.6s" repeatCount="indefinite"/>

    <circle cx="85" cy="96" r="52" fill="none" stroke="#4f46e5" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="46;60;46" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" cy="96" r="52" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.22">
      <animate attributeName="r" values="46;60;46" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0;0.22" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>

    <g opacity="0.6" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M118 18 Q 122 10 118 4">
        <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 6;0 -4;0 6" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M128 22 Q 132 14 128 8">
        <animate attributeName="opacity" values="0;0.8;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 6;0 -4;0 6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <circle cx="33" cy="98" r="8" fill="url(#bodyGrad)"/>
    <circle cx="137" cy="98" r="8" fill="url(#bodyGrad)"/>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" dur="1.6s" repeatCount="indefinite"/>
      <path d="M60 44 Q60 20 85 20 Q110 20 110 44 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="66" cy="26" r="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="85" cy="16" r="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="104" cy="26" r="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="58" y="42" width="54" height="10" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>

    <rect x="35" y="52" width="100" height="90" rx="36" fill="url(#bodyGrad)" filter="url(#softShadow)"/>

    <rect x="47" y="68" width="76" height="58" rx="26" fill="#ffffff"/>

    <ellipse cx="60" cy="108" rx="9" ry="6" fill="url(#cheekGrad)"/>
    <ellipse cx="110" cy="108" rx="9" ry="6" fill="url(#cheekGrad)"/>

    <g fill="#4f46e5">
      <ellipse cx="67" cy="96" rx="7" ry="9">
        <animate attributeName="ry" values="9;9;1;9;9" keyTimes="0;0.42;0.46;0.5;1" dur="3.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="103" cy="96" rx="7" ry="9">
        <animate attributeName="ry" values="9;9;1;9;9" keyTimes="0;0.42;0.46;0.5;1" dur="3.2s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="69.5" cy="93" r="2" fill="#ffffff"/>
      <circle cx="105.5" cy="93" r="2" fill="#ffffff"/>
    </g>

    <g stroke="#0ea5e9" stroke-width="3" stroke-linecap="round">
      <line x1="77" y1="114" x2="77" y2="114">
        <animate attributeName="y1" values="112;116;112" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="116;112;116" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="83" y1="110" x2="83" y2="118">
        <animate attributeName="y1" values="108;114;108" dur="0.6s" begin="0.1s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="118;112;118" dur="0.6s" begin="0.1s" repeatCount="indefinite"/>
      </line>
      <line x1="89" y1="108" x2="89" y2="120">
        <animate attributeName="y1" values="106;114;106" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="120;112;120" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
      </line>
      <line x1="95" y1="110" x2="95" y2="118">
        <animate attributeName="y1" values="108;114;108" dur="0.6s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="118;112;118" dur="0.6s" begin="0.3s" repeatCount="indefinite"/>
      </line>
      <line x1="101" y1="114" x2="101" y2="114">
        <animate attributeName="y1" values="112;116;112" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="116;112;116" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- left arm, holding a fork -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 27 126; -14 27 126; 0 27 126" dur="1.2s" repeatCount="indefinite"/>
      <line x1="35" y1="126" x2="16" y2="112" stroke="#4f46e5" stroke-width="6" stroke-linecap="round"/>

      <!-- fork, handle down toward hand, tines up -->
      <g transform="translate(16,112) rotate(-25)">
        <animateTransform attributeName="transform" type="rotate" values="-25;-32;-25" additive="sum" dur="1.2s" repeatCount="indefinite"/>
        <rect x="-2.5" y="4" width="5" height="30" rx="2.5" fill="#94a3b8"/>
        <rect x="-8" y="-16" width="3.5" height="20" rx="1.5" fill="#cbd5e1"/>
        <rect x="-1.75" y="-16" width="3.5" height="20" rx="1.5" fill="#cbd5e1"/>
        <rect x="4.5" y="-16" width="3.5" height="20" rx="1.5" fill="#cbd5e1"/>
        <rect x="-8" y="2" width="12" height="5" rx="2.5" fill="#cbd5e1"/>
      </g>
    </g>

    <!-- right arm, holding a wooden cooking spoon -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 143 122; -10 143 122; 0 143 122" dur="1.3s" repeatCount="indefinite"/>
      <line x1="135" y1="122" x2="154" y2="108" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>

      <!-- spoon, handle down toward hand, bowl up -->
      <g transform="translate(154,108) rotate(25)">
        <animateTransform attributeName="transform" type="rotate" values="25;18;25" additive="sum" dur="1.3s" repeatCount="indefinite"/>
        <rect x="-2.5" y="-2" width="5" height="34" rx="2.5" fill="#a16207"/>
        <ellipse cx="0" cy="-8" rx="9" ry="12" fill="#c2884a"/>
        <ellipse cx="0" cy="-8" rx="6" ry="8.5" fill="#a16207"/>
      </g>
    </g>
  </g>
</svg>

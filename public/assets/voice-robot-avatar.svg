<svg width="160" height="180" viewBox="0 0 160 180" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Cute AI voice assistant — listening animation</title>
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fab" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff8fab" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4f46e5" flood-opacity="0.28"/>
    </filter>
  </defs>

  <ellipse cx="80" cy="168" rx="34" ry="6" fill="#4f46e5" opacity="0.15">
    <animate attributeName="rx" values="34;28;34" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.08;0.15" dur="1.6s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="1.6s" repeatCount="indefinite"/>

    <circle cx="80" cy="78" r="50" fill="none" stroke="#4f46e5" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="44;58;44" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="78" r="50" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.22">
      <animate attributeName="r" values="44;58;44" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0;0.22" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="30" cy="80" r="8" fill="url(#bodyGrad)"/>
    <circle cx="130" cy="80" r="8" fill="url(#bodyGrad)"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 80 46; 6 80 46; -6 80 46" dur="1.4s" repeatCount="indefinite"/>
      <line x1="80" y1="46" x2="80" y2="30" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="80" cy="25" r="6" fill="#facc15">
        <animate attributeName="opacity" values="1;0.5;1" dur="0.9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="30" y="46" width="100" height="90" rx="36" fill="url(#bodyGrad)" filter="url(#softShadow)"/>

    <rect x="42" y="62" width="76" height="58" rx="26" fill="#ffffff"/>

    <ellipse cx="55" cy="102" rx="9" ry="6" fill="url(#cheekGrad)"/>
    <ellipse cx="105" cy="102" rx="9" ry="6" fill="url(#cheekGrad)"/>

    <g fill="#4f46e5">
      <ellipse cx="62" cy="90" rx="7" ry="9">
        <animate attributeName="ry" values="9;9;1;9;9" keyTimes="0;0.42;0.46;0.5;1" dur="3.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="98" cy="90" rx="7" ry="9">
        <animate attributeName="ry" values="9;9;1;9;9" keyTimes="0;0.42;0.46;0.5;1" dur="3.2s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="64.5" cy="87" r="2" fill="#ffffff"/>
      <circle cx="100.5" cy="87" r="2" fill="#ffffff"/>
    </g>

    <g stroke="#0ea5e9" stroke-width="3" stroke-linecap="round">
      <line x1="72" y1="108" x2="72" y2="108">
        <animate attributeName="y1" values="106;110;106" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="110;106;110" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="78" y1="104" x2="78" y2="112">
        <animate attributeName="y1" values="102;108;102" dur="0.6s" begin="0.1s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="112;106;112" dur="0.6s" begin="0.1s" repeatCount="indefinite"/>
      </line>
      <line x1="84" y1="102" x2="84" y2="114">
        <animate attributeName="y1" values="100;108;100" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="114;106;114" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
      </line>
      <line x1="90" y1="104" x2="90" y2="112">
        <animate attributeName="y1" values="102;108;102" dur="0.6s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="112;106;112" dur="0.6s" begin="0.3s" repeatCount="indefinite"/>
      </line>
      <line x1="96" y1="108" x2="96" y2="108">
        <animate attributeName="y1" values="106;110;106" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="110;106;110" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
      </line>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 22 120; -18 22 120; 0 22 120" dur="1.2s" repeatCount="indefinite"/>
      <line x1="30" y1="120" x2="14" y2="132" stroke="#4f46e5" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 138 120; 18 138 120; 0 138 120" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
      <line x1="130" y1="120" x2="146" y2="132" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
